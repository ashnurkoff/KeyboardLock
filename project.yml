name: KeyboardLock

options:
  bundleIdPrefix: com.alexshnurkov
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"

targets:
  KeyboardLock:
    type: application
    platform: macOS
    sources:
      - path: KeyboardLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexshnurkov.KeyboardLock
        PRODUCT_NAME: KeyboardLock
        INFOPLIST_FILE: KeyboardLock/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - KeyboardLockTests
      gatherCoverageData: true
      coverageTargets:
        - KeyboardLock

  KeyboardLockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeyboardLockTests
    dependencies:
      - target: KeyboardLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexshnurkov.KeyboardLockTests
        GENERATE_INFOPLIST_FILE: YES
